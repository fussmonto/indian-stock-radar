        <button data-mode="ALL" class="mode-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-emerald-600 text-white transition">All Setups</button>
        <button data-mode="CNC" class="mode-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition">CNC Delivery (Swing)</button>

        <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-2.5"></i>

    </section>

    </section>

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.remove("hidden");
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => t.classList.add("hidden"), 2800);
    }

    function getFilteredStocks() {
      return appData.stocks.filter(s => {
        const matchSearch = !searchQuery || s.symbol.toLowerCase().includes(searchQuery) || s.name.toLowerCase().includes(searchQuery) || s.sector.toLowerCase().includes(searchQuery);
        if (!matchSearch) return false;
        if (activeMode === "CNC") return s.mode === "CNC";
        if (activeMode === "INTRADAY") return s.mode === "INTRADAY";
        if (activeMode === "PENNY") return s.price < 100;
        return true;
      });
    }

    function renderTabs() {
      const container = document.getElementById("module-tabs");
      container.innerHTML = MODULES.map(m => `
        <button data-tab="${m.id}" class="tab-btn inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium border transition ${activeTab === m.id ? 'tab-active' : 'bg-slate-900 text-slate-300 border-slate-800 hover:bg-slate-800'}">

          <span>${m.label}</span>
        </button>
      `).join("");
      container.querySelectorAll(".tab-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          activeTab = btn.dataset.tab;
          renderTabs();
          renderModule();
        });
      });
      lucide.createIcons();
    }

    
    let chatMessages = [];

    function getDailyCncPicks() {
      return appData.stocks
        .filter(s => s.mode === "CNC" || s.rsi14 < 58)
        .slice()
        .sort((a, b) => {
          const scoreA = (a.rsi14 >= 35 && a.rsi14 <= 58 ? 20 : 0) + (a.price >= a.ema200 ? 10 : 0) + a.vol_ratio * 5;
          const scoreB = (b.rsi14 >= 35 && b.rsi14 <= 58 ? 20 : 0) + (b.price >= b.ema200 ? 10 : 0) + b.vol_ratio * 5;
          return scoreB - scoreA;
        });
    }

    function generateAssistantReply(promptText) {
      const q = promptText.toLowerCase();
      const picks = getDailyCncPicks();
      const matchedStock = appData.stocks.find(s => q.includes(s.symbol.toLowerCase()));
      if (matchedStock) {
        return `${matchedStock.symbol} (${matchedStock.name}) is at ₹${matchedStock.price.toFixed(2)} (${matchedStock.change_pct >= 0 ? '+' : ''}${matchedStock.change_pct.toFixed(2)}%). Ideal Buy Zone: ${matchedStock.buy_zone} | Breakout above ₹${matchedStock.breakout_trigger.toFixed(2)} | Stop-Loss: ₹${matchedStock.stop_loss.toFixed(2)} | Targets: ₹${matchedStock.target1.toFixed(2)} / ₹${matchedStock.target2.toFixed(2)}. Setup: ${matchedStock.setup}.`;
      }
      if (q.includes("intraday") || q.includes("mis")) {
        const intra = appData.stocks.filter(s => s.mode === "INTRADAY");
        if (!intra.length) return "No Intraday MIS setups matched in the current dataset.";
        return "Top Intraday (MIS) Setups Today:\n" + intra.map(s => `• ${s.symbol} (₹${s.price.toFixed(2)}): Buy ${s.buy_zone} or above ₹${s.breakout_trigger.toFixed(2)}, SL ₹${s.stop_loss.toFixed(2)}, T1 ₹${s.target1.toFixed(2)} (${s.setup})`).join("\n");
      }
      if (q.includes("oversold") || q.includes("dip") || q.includes("cheap") || q.includes("under")) {
        const dips = appData.stocks.filter(s => s.rsi14 < 48 || s.price < 100);
        return "Oversold / Under-₹100 Watchlist:\n" + dips.map(s => `• ${s.symbol} at ₹${s.price.toFixed(2)} (RSI ${s.rsi14.toFixed(1)}): Buy Zone ${s.buy_zone}, SL ₹${s.stop_loss.toFixed(2)}, T1 ₹${s.target1.toFixed(2)}`).join("\n");
      }
      return "Today's Top Normal CNC Delivery Picks (Updated " + appData.meta.updated_ist + "):\n" +
        picks.slice(0, 4).map(s => `• ${s.symbol} — Current ₹${s.price.toFixed(2)} | Buy Price: ${s.buy_zone} | SL: ₹${s.stop_loss.toFixed(2)} | Target: ₹${s.target1.toFixed(2)} (${s.setup})`).join("\n");
    }

        });

          const maxDd = strat === "cnc_dip" ? "-3.8%" : "-5.4%";
          const finalVal = Math.round(cap * mults[mults.length - 1]);
          const netRet = (((finalVal - cap) / cap) * 100).toFixed(1);
          document.getElementById("bt-stats").innerHTML = `
            <div class="p-2.5 rounded-lg bg-slate-900 border border-slate-800"><div class="text-slate-400">Simulated Final</div><div class="font-bold text-emerald-400">₹${finalVal.toLocaleString('en-IN')}</div></div>
            <div class="p-2.5 rounded-lg bg-slate-900 border border-slate-800"><div class="text-slate-400">Net Return</div><div class="font-bold text-emerald-300">+${netRet}%</div></div>
            <div class="p-2.5 rounded-lg bg-slate-900 border border-slate-800"><div class="text-slate-400">Win Rate</div><div class="font-bold text-white">${winRate}</div></div>

          const prod = document.getElementById("bm-prod").value;
          const entry = Math.max(0.1, Number(document.getElementById("bm-entry").value) || 1);
          const sl = Math.max(0.05, Number(document.getElementById("bm-sl").value) || 0.5);
          const tgt = Math.max(0.1, Number(document.getElementById("bm-tgt").value) || entry * 1.1);
          const riskPerShare = Math.max(0.05, Math.abs(entry - sl));
          const maxRiskRs = (cap * riskPct) / 100;
          const leverage = prod === "MIS" ? 5 : 1;
          const maxAffordableQty = Math.floor((cap * leverage) / entry);
          const riskBasedQty = Math.floor(maxRiskRs / riskPerShare);
          const qty = Math.max(1, Math.min(maxAffordableQty, riskBasedQty));
          const reqMargin = (qty * entry) / leverage;
          const estProfit = qty * (tgt - entry);

          const qty = Math.max(1, Number(document.getElementById("ot-qty").value) || 1);
          const type = document.getElementById("ot-type").value;
          const txt = `EXCHANGE: NSE | SYMBOL: ${s.symbol}\nACTION: BUY | PRODUCT: ${prod} | ORDER: ${type}\nQTY: ${qty} | ENTRY: ₹${s.price.toFixed(2)}\nSTOP-LOSS (GTT): ₹${s.stop_loss.toFixed(2)} | TARGET 1: ₹${s.target1.toFixed(2)}\nEST. VALUE: ₹${Math.round(qty * s.price).toLocaleString('en-IN')}`;
          document.getElementById("ot-summary").textContent = txt;
        };
        ["ot-sym", "ot-prod", "ot-qty", "ot-type"].forEach(id => document.getElementById(id).addEventListener("input", updateTicket));
        document.getElementById("ot-copy").addEventListener("click", () => {
          const text = document.getElementById("ot-summary").textContent;
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => showToast("Order ticket copied!")).catch(() => {});
          } else {
            const ta = document.createElement("textarea");
            ta.value = text; document.body.appendChild(ta); ta.select();
            document.execCommand("copy"); document.body.removeChild(ta);
            showToast("Order ticket copied!");
          }
        });
        updateTicket();
      }

      
      
      if (activeTab === "ranges") {
        document.querySelectorAll(".df-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            rangeDeliveryFilter = btn.dataset.df;
            renderModule();
          });
        });
        document.querySelectorAll(".range-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            selectedRange = btn.dataset.range;
            renderModule();
          });
        });
      }

      if (activeTab === "mybuys") {
        document.getElementById("mb-add").addEventListener("click", () => {
          const symbol = document.getElementById("mb-sym").value.trim().toUpperCase();
          const targetBuy = parseFloat(document.getElementById("mb-buy").value);
          const boughtPrice = parseFloat(document.getElementById("mb-held").value) || 0;
          const qty = parseInt(document.getElementById("mb-qty").value, 10) || 0;
          const note = document.getElementById("mb-note").value.trim();
          if (!symbol || !targetBuy || targetBuy <= 0) { showToast("Enter symbol and valid target buy price"); return; }
          myBuys.unshift({ id: Date.now(), symbol, targetBuy, boughtPrice, qty, note });
          saveMyBuys(myBuys);
          showToast(`Saved ${symbol} @ ₹${targetBuy.toFixed(2)}`);
          renderModule();
        });
        document.querySelectorAll(".mb-del").forEach(btn => {
          btn.addEventListener("click", () => {
            const id = Number(btn.dataset.id);
            myBuys = myBuys.filter(x => x.id !== id);
            saveMyBuys(myBuys);
            renderModule();
          });
        });
      }

      if (activeTab === "alerts") {
        document.getElementById("al-add").addEventListener("click", () => {
          const symbol = document.getElementById("al-sym").value;
          const condition = document.getElementById("al-cond").value;
          const price = parseFloat(document.getElementById("al-price").value);
          const note = document.getElementById("al-note").value.trim();
          if (!price || price <= 0) { showToast("Enter a valid price"); return; }
          priceAlerts.unshift({ id: Date.now(), symbol, condition, price, note });
          saveAlerts(priceAlerts);
          showToast(`Alert saved for ${symbol}`);
          renderModule();
        });
        document.querySelectorAll(".al-del").forEach(btn => {
          btn.addEventListener("click", () => {
            const id = Number(btn.dataset.id);
            priceAlerts = priceAlerts.filter(a => a.id !== id);
            saveAlerts(priceAlerts);
            renderModule();
          });
        });
      }
    }

    function renderModule() {
      const stocks = getFilteredStocks();
      const view = document.getElementById("module-view");
      if (activeTab === "assistant") view.innerHTML = renderAssistant();
      else if (activeTab === "scanner") view.innerHTML = renderScanner(stocks.length ? stocks : appData.stocks);
      else if (activeTab === "news") view.innerHTML = renderNews();
      else if (activeTab === "entry") view.innerHTML = renderEntry(stocks.length ? stocks : appData.stocks);
      else if (activeTab === "exit") view.innerHTML = renderExit(stocks.length ? stocks : appData.stocks);
      else if (activeTab === "timemachine") view.innerHTML = renderTimeMachine();
      else if (activeTab === "risk") view.innerHTML = renderRiskManager();
      else if (activeTab === "budget") view.innerHTML = renderBudgetManager();
      else if (activeTab === "order") view.innerHTML = renderOrderTicket();
      else if (activeTab === "alerts") view.innerHTML = renderAlerts();
      else if (activeTab === "earnings") view.innerHTML = renderEarnings(stocks.length ? stocks : appData.stocks);
      else if (activeTab === "smartmoney") view.innerHTML = renderSmartMoney();
      else if (activeTab === "mybuys") view.innerHTML = renderMyBuys();
      else if (activeTab === "ranges") view.innerHTML = renderRanges();

      lucide.createIcons();
      attachModuleEvents(stocks.length ? stocks : appData.stocks);
    }

    // Mode & Search listeners
    document.querySelectorAll(".mode-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        activeMode = btn.dataset.mode;
        document.querySelectorAll(".mode-btn").forEach(b => {
          b.className = b.dataset.mode === activeMode
            ? "mode-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-emerald-600 text-white transition"
            : "mode-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition";
        });
        renderModule();
      });
    });

    document.getElementById("ticker-search").addEventListener("input", (e) => {
      searchQuery = e.target.value.trim().toLowerCase();
      renderModule();
    });

    document.getElementById("json-upload").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          if (parsed && Array.isArray(parsed.stocks)) {
            appData = parsed;
            chatMessages = [];
            if (appData.meta && appData.meta.updated_ist) {
              document.getElementById("last-updated-text").textContent = "Updated: " + appData.meta.updated_ist;
            }
            if (appData.meta && appData.meta.nifty50) {
              document.getElementById("nifty-val").textContent = Number(appData.meta.nifty50.price).toLocaleString("en-IN");
              const chg = Number(appData.meta.nifty50.change_pct);
              document.getElementById("nifty-chg").textContent = `(${chg >= 0 ? '+' : ''}${chg.toFixed(2)}%)`;
            }
            renderModule();
            showToast("Loaded daily_report.json successfully!");
          }
        } catch (err) {
          showToast("Invalid JSON format");
        }
      };
      reader.readAsText(file);
    });

    // Auto-load ./data/daily_report.json when hosted on Cloudflare Pages
    async function tryLoadLiveRepoData() {
      if (!window.location.protocol.startsWith("http")) return;
      try {
        const res = await fetch("./data/daily_report.json?t=" + Date.now());
        if (res.ok) {
          const parsed = await res.json();
          if (parsed && Array.isArray(parsed.stocks)) {
            appData = parsed;
            chatMessages = [];
            if (appData.meta && appData.meta.updated_ist) {
              document.getElementById("last-updated-text").textContent = "Updated: " + appData.meta.updated_ist;
            }
            if (appData.meta && appData.meta.nifty50) {
              document.getElementById("nifty-val").textContent = Number(appData.meta.nifty50.price).toLocaleString("en-IN");
              const chg = Number(appData.meta.nifty50.change_pct);
              document.getElementById("nifty-chg").textContent = `(${chg >= 0 ? '+' : ''}${chg.toFixed(2)}%)`;
            }
            renderModule();
          }
        }
      } catch (e) {}
    }

    renderTabs();
    renderModule();
    tryLoadLiveRepoData();
  </script>
</body>
</html>
