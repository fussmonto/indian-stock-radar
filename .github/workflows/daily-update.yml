name: Update NSE Daily Trading & CNC Data

on:
  schedule:
    # 08:45 AM IST (03:15 UTC) - Morning Pre-Market / Open Setup (Mon-Fri)
    - cron: "15 3 * * 1-5"
    # 03:45 PM IST (10:15 UTC) - Post-Market Closing & CNC Delivery Setup (Mon-Fri)
    - cron: "15 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Private Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Fetch NSE Data & Generate Report
        run: python scripts/update_market.py

      - name: Commit & Push Updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/daily_report.json
          git diff --staged --quiet || git commit -m "chore: update NSE daily report [skip ci]" || true
          git push
